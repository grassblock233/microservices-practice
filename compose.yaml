name: campus-takeaway

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the same nacos admin password in the console}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --data-urlencode 'username=nacos'
          --data-urlencode "password=$${NACOS_PASSWORD}"
          http://localhost:8848/nacos/v3/auth/user/login | grep -q accessToken
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [campus-network]

  user-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: campus_user
      MYSQL_USER: user_app
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${USER_MYSQL_ROOT_PASSWORD:?Set USER_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - user-data:/var/lib/mysql
      - ./scripts/microservices/user/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [campus-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  user-service:
    build:
      context: ./services/user-service
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://user-db:3306/campus_user
      DB_USERNAME: user_app
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [campus-network]

  dish-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: campus_dish
      MYSQL_USER: dish_app
      MYSQL_PASSWORD: ${DISH_DB_PASSWORD:?Set DISH_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DISH_MYSQL_ROOT_PASSWORD:?Set DISH_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - dish-data:/var/lib/mysql
      - ./scripts/microservices/dish/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [campus-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  dish-service:
    build:
      context: ./services/dish-service
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://dish-db:3306/campus_dish
      DB_USERNAME: dish_app
      DB_PASSWORD: ${DISH_DB_PASSWORD:?Set DISH_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      dish-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [campus-network]

  order-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: campus_order
      MYSQL_USER: order_app
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD:?Set ORDER_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - order-data:/var/lib/mysql
      - ./scripts/microservices/order/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [campus-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  order-service:
    build:
      context: ./services/order-service
    ports: ["8083:8083"]
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://order-db:3306/campus_order
      DB_USERNAME: order_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
    depends_on:
      order-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
      user-service:
        condition: service_healthy
      dish-service:
        condition: service_healthy
    networks: [campus-network]

volumes:
  nacos-data:
  user-data:
  dish-data:
  order-data:

networks:
  campus-network:
    driver: bridge

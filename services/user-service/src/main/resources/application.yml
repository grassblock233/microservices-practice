server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://user-db:3306/campus_user}
    username: ${DB_USERNAME:user_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      accept-float-as-int: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://order-db:3306/campus_order}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      accept-float-as-int: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
clients:
  user:
    base-url: ${USER_SERVICE_URL:http://user-service:8081}
  dish:
    base-url: ${DISH_SERVICE_URL:http://dish-service:8082}
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
  read-timeout: ${HTTP_READ_TIMEOUT:5s}

spring:
  cloud:
    loadbalancer:
      cache:
        # 测试会动态切换 DiscoveryClient 实例，避免缓存跨用例保留旧地址。
        enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
  datasource:
    # 为每个 Spring 测试上下文使用独立数据库
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      accept-float-as-int: false

spring:
  datasource:
    url: jdbc:h2:mem:business-tests;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      accept-float-as-int: false
